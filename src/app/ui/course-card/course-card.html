<div class="card">
    <!-- <h3>{{ course().title }} ({{ course().code }})</h3> -->
  <h3>
    <a [routerLink]="['/courses', course().id]">{{ course().title }}</a>
    ({{ course().code }})
  </h3>
  <p>
    Enrolled {{ course().enrollmentCount }} of {{ course().maxCapacity }} seats
  </p>
  <span
    class="badge"
    [class.closed]="course().enrollmentCount >= course().maxCapacity"
  >
    {{
      course().enrollmentCount >= course().maxCapacity
        ? 'Full'
        : 'Accepting enrollments'
    }}
  </span>
  <button
    (click)="enrollClicked.emit(course())"
    [disabled]="course().enrollmentCount >= course().maxCapacity"
  >
    <!-- Enroll -->
    <a [routerLink]="['/enroll']">Enroll</a>
  </button>
  @if (auth.hasRole('Admin')) {
    <button (click)="deleteClicked.emit(course().id)" class="btn-danger">
      Delete Course
    </button>
  }
</div>
